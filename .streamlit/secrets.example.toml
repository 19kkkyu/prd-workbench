# Copy into Streamlit Community Cloud > Advanced settings > Secrets.
# Do NOT commit a filled-in secrets.toml to GitHub.
STORAGE_BACKEND = "supabase"
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = ""
AI_PROVIDER = "gemini"
GEMINI_API_KEY = ""
GEMINI_MODEL = "gemini-2.5-flash"
# For OpenAI instead, set AI_PROVIDER = "openai" and fill these:
OPENAI_API_KEY = ""
OPENAI_MODEL = "gpt-4.1-mini"
MAX_FILE_MB = "200"
MAX_DOCUMENT_CHARS = "600000"
CHUNK_CHARS = "18000"
DAILY_CALL_LIMIT = "150"
